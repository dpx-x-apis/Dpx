<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DPX Premium Slots</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0d0d12;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            background-image: radial-gradient(circle, #1a1a2e 0%, #000000 100%);
        }

        .casino-container {
            background: linear-gradient(145deg, #232526, #414345);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.2), inset 0 0 20px rgba(0, 0, 0, 0.8);
            border: 2px solid #ffd700;
            text-align: center;
            width: 90%;
            max-width: 500px;
        }

        h1 {
            color: #ffd700;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        .stats-panel {
            display: flex;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.6);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 1px solid #555;
        }

        .stats-panel div {
            font-size: 1.2rem;
            font-weight: bold;
        }

        .balance {
            color: #4CAF50;
        }

        .machine {
            background: #111;
            padding: 20px;
            border-radius: 15px;
            border: 4px solid #333;
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 1);
            position: relative;
        }

        .reels-container {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .reel {
            width: 80px;
            height: 100px;
            background: white;
            border-radius: 10px;
            font-size: 3rem;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
            border: 2px solid #ccc;
            overflow: hidden;
            position: relative;
        }

        .reel span {
            position: absolute;
            transition: top 0.1s linear;
        }

        .controls {
            margin-top: 30px;
        }

        button {
            background: linear-gradient(to bottom, #ffd700, #b8860b);
            color: #000;
            border: none;
            padding: 15px 40px;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 215, 0, 0.4);
            transition: all 0.2s ease;
            text-transform: uppercase;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 25px rgba(255, 215, 0, 0.6);
        }

        button:active {
            transform: scale(0.95);
        }

        button:disabled {
            background: gray;
            color: #ccc;
            cursor: not-allowed;
            box-shadow: none;
        }

        .message {
            margin-top: 20px;
            font-size: 1.2rem;
            font-weight: bold;
            min-height: 30px;
            color: #fff;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
        }

        .win-glow {
            animation: glow 1s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { box-shadow: 0 0 10px #ffd700, inset 0 0 10px #ffd700; }
            to { box-shadow: 0 0 30px #ff0000, inset 0 0 20px #ff0000; }
        }
    </style>
</head>
<body>

    <div class="casino-container">
        <h1>Premium Slots</h1>
        
        <div class="stats-panel">
            <div>Bet: ₹<span id="betAmount">10</span></div>
            <div class="balance">Balance: ₹<span id="balance">100</span></div>
        </div>

        <div class="machine" id="machine">
            <div class="reels-container">
                <div class="reel"><span id="reel1">💎</span></div>
                <div class="reel"><span id="reel2">🍒</span></div>
                <div class="reel"><span id="reel3">🔔</span></div>
            </div>
        </div>

        <div class="controls">
            <button id="spinBtn" onclick="spin()">SPIN</button>
        </div>

        <div class="message" id="message">Good Luck!</div>
    </div>

    <script>
        const symbols = ['🍒', '🔔', '💎', '7️⃣', '🍋'];
        const values = {
            '🍒': 20,
            '🍋': 30,
            '🔔': 50,
            '💎': 100,
            '7️⃣': 500
        };

        let balance = 100; // Starting demo balance
        const bet = 10;
        let isSpinning = false;

        const balanceEl = document.getElementById('balance');
        const messageEl = document.getElementById('message');
        const machineEl = document.getElementById('machine');
        const spinBtn = document.getElementById('spinBtn');

        function getRandomSymbol() {
            return symbols[Math.floor(Math.random() * symbols.length)];
        }

        function spin() {
            if (isSpinning) return;
            
            if (balance < bet) {
                messageEl.style.color = '#ff4444';
                messageEl.innerText = 'Insufficient Balance! Please Deposit.';
                return;
            }

            // Deduct bet
            balance -= bet;
            balanceEl.innerText = balance;
            messageEl.style.color = '#ffffff';
            messageEl.innerText = 'Spinning...';
            machineEl.classList.remove('win-glow');
            isSpinning = true;
            spinBtn.disabled = true;

            const r1 = document.getElementById('reel1');
            const r2 = document.getElementById('reel2');
            const r3 = document.getElementById('reel3');

            // Animation effect
            let spins = 0;
            const spinInterval = setInterval(() => {
                r1.innerText = getRandomSymbol();
                r2.innerText = getRandomSymbol();
                r3.innerText = getRandomSymbol();
                spins++;

                if (spins > 20) {
                    clearInterval(spinInterval);
                    finalizeSpin(r1, r2, r3);
                }
            }, 50);
        }

        function finalizeSpin(r1, r2, r3) {
            // Final logic randomizer
            const final1 = getRandomSymbol();
            const final2 = getRandomSymbol();
            const final3 = getRandomSymbol();

            r1.innerText = final1;
            r2.innerText = final2;
            r3.innerText = final3;

            checkWin(final1, final2, final3);
            isSpinning = false;
            spinBtn.disabled = false;
        }

        function checkWin(s1, s2, s3) {
            if (s1 === s2 && s2 === s3) {
                const winAmount = values[s1];
                balance += winAmount;
                balanceEl.innerText = balance;
                messageEl.style.color = '#ffd700';
                messageEl.innerText = `JACKPOT! You won ₹${winAmount}!`;
                machineEl.classList.add('win-glow');
            } else if (s1 === s2 || s2 === s3 || s1 === s3) {
                // Mini win for 2 matches
                const winAmount = 15;
                balance += winAmount;
                balanceEl.innerText = balance;
                messageEl.style.color = '#4CAF50';
                messageEl.innerText = `Nice! You won ₹${winAmount}!`;
            } else {
                messageEl.style.color = '#ff9800';
                messageEl.innerText = 'Try Again!';
            }
        }
    </script>
</body>
</html>
